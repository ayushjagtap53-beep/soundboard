<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Soundboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">

  <h1>Soundboard</h1>

  <div class="soundboard">
    <button class="sound-btn" data-sound="dog" data-key="D">Dog (D)</button>
    <button class="sound-btn" data-sound="clap" data-key="C">Clap (C)</button>
    <button class="sound-btn" data-sound="pop" data-key="P">Pop (P)</button>
    <button class="sound-btn" data-sound="laugh" data-key="L">Laugh (L)</button>
    <button class="sound-btn" data-sound="ding" data-key="I">Ding (I)</button>
    <button class="sound-btn" data-sound="coin" data-key="O">Coin (O)</button>
  </div>

  <div class="controls">
    <label style="color:white;">Volume:</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
    <button id="muteBtn">Mute</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
